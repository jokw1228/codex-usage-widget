<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex Usage Widget</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="widget" class="widget">
      <div class="card-inner">
        <section class="card-face card-front" aria-label="사용량">
          <header class="header">
            <div class="title-block">
              <div class="eyebrow">
                <span>Codex</span>
                <span id="status" class="status-pill">연결 중</span>
              </div>
              <h1>남은 사용량</h1>
            </div>
            <div class="actions">
              <span id="updated" class="updated-time">--:--</span>
              <button id="refresh" class="icon-button" type="button" title="새로고침">↻</button>
              <button id="options" class="icon-button" type="button" title="옵션">⚙</button>
              <button id="close" class="icon-button close-button" type="button" title="닫기">×</button>
            </div>
          </header>

          <nav id="limitTabs" class="limit-tabs" role="tablist" aria-label="사용량 한도" hidden></nav>

          <div id="usagePanel" class="usage-panel" role="region" aria-label="선택한 한도" tabindex="0">
            <p id="limitSource" class="limit-source">한도 확인 중</p>
            <p id="emptyState" class="empty-state" role="status" hidden></p>
            <section id="errorPanel" class="error-panel" aria-live="polite" hidden>
              <strong>Codex 연결 필요</strong>
              <p>Codex Desktop 또는 Codex CLI를 설치하고 ChatGPT 계정으로 로그인해 주세요.</p>
              <small id="errorDetail"></small>
            </section>

            <section id="meters" class="meters" aria-live="polite">
              <article class="meter" data-tone="primary" hidden>
                <div class="meter-top">
                  <span id="primaryLabel">5시간</span>
                  <strong id="primaryRemaining">--%</strong>
                </div>
                <div class="track">
                  <div id="primaryBar" class="bar"></div>
                </div>
                <time id="primaryReset">리셋 확인 중</time>
              </article>

              <article class="meter" data-tone="secondary" hidden>
                <div class="meter-top">
                  <span id="secondaryLabel">1주</span>
                  <strong id="secondaryRemaining">--%</strong>
                </div>
                <div class="track">
                  <div id="secondaryBar" class="bar"></div>
                </div>
                <time id="secondaryReset">리셋 확인 중</time>
              </article>
            </section>
          </div>
        </section>

        <section class="card-face card-back" aria-label="옵션">
          <header class="header">
            <div class="title-block">
              <div class="eyebrow">
                <span>Settings</span>
              </div>
              <h1>옵션</h1>
            </div>
            <div class="actions">
              <button id="settingsClose" class="icon-button" type="button" title="돌아가기">↩</button>
              <button id="settingsQuit" class="icon-button close-button" type="button" title="닫기">×</button>
            </div>
          </header>

          <div class="settings-content">
            <label class="range-row" for="opacityRange">
              <span>투명도</span>
              <output id="opacityValue" for="opacityRange">95%</output>
            </label>
            <input id="opacityRange" type="range" min="45" max="100" value="95" />
            <button id="resetSettings" class="text-button" type="button">설정 초기화</button>
          </div>
        </section>
      </div>
      <div class="resize-handle resize-n" data-resize="n"></div>
      <div class="resize-handle resize-e" data-resize="e"></div>
      <div class="resize-handle resize-s" data-resize="s"></div>
      <div class="resize-handle resize-w" data-resize="w"></div>
      <div class="resize-handle resize-ne" data-resize="ne"></div>
      <div class="resize-handle resize-se" data-resize="se"></div>
      <div class="resize-handle resize-sw" data-resize="sw"></div>
      <div class="resize-handle resize-nw" data-resize="nw"></div>
    </main>

    <script type="module" src="./renderer.js"></script>
  </body>
</html>
